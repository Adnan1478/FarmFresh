<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Definitions for Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9" />
      <stop offset="100%" stop-color="#C8E6C9" />
    </linearGradient>
    <linearGradient id="crateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="100%" stop-color="#5D4037" />
    </linearGradient>
    <linearGradient id="tomatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>
    <linearGradient id="broccoliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <linearGradient id="pepperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="300" rx="15" fill="url(#bgGrad)" />

  <!-- Wooden Crate Back -->
  <rect x="50" y="160" width="300" height="90" rx="4" fill="#4E342E" />

  <!-- Vegetables in the Crate -->
  
  <!-- Lettuce / Greens in background -->
  <path d="M 60,170 C 60,120 100,100 120,130 C 140,100 180,120 180,150 C 180,130 220,120 230,150 C 250,110 300,120 310,160 C 320,140 340,150 340,170 Z" fill="#4CAF50" opacity="0.9"/>
  <path d="M 80,165 C 90,130 120,120 140,145 C 160,115 200,130 210,160 Z" fill="#388E3C" opacity="0.9"/>

  <!-- Broccoli Left -->
  <g transform="translate(90, 130)">
    <path d="M 20,40 C 5,40 0,25 10,15 C 5,5 20,-5 30,5 C 40,-5 55,5 50,15 C 60,25 55,40 40,40 Z" fill="url(#broccoliGrad)"/>
    <rect x="25" y="35" width="10" height="20" rx="2" fill="#81C784" />
    <!-- Texture -->
    <circle cx="20" cy="15" r="2" fill="#1B5E20" opacity="0.3"/>
    <circle cx="35" cy="10" r="2.5" fill="#1B5E20" opacity="0.3"/>
    <circle cx="45" cy="20" r="2" fill="#1B5E20" opacity="0.3"/>
    <circle cx="28" cy="25" r="3" fill="#1B5E20" opacity="0.3"/>
  </g>

  <!-- Carrots Center -->
  <g transform="translate(190, 90) rotate(15)">
    <!-- Carrot 1 -->
    <path d="M 15,10 L 30,10 L 22,90 Z" fill="url(#carrotGrad)"/>
    <!-- Carrot Greens -->
    <path d="M 22,10 Q 15,-15 5,-10 Q 22,-5 22,10" fill="#2E7D32" stroke="#2E7D32" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 22,10 Q 22,-20 22,-10 Q 22,-5 22,10" fill="#2E7D32" stroke="#2E7D32" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 22,10 Q 30,-15 40,-10 Q 22,-5 22,10" fill="#2E7D32" stroke="#2E7D32" stroke-width="2" stroke-linejoin="round"/>
    <!-- Lines on Carrot -->
    <line x1="18" y1="30" x2="25" y2="32" stroke="#E65100" stroke-width="1.5" />
    <line x1="20" y1="50" x2="26" y2="51" stroke="#E65100" stroke-width="1.5" />
    <line x1="21" y1="70" x2="25" y2="70.5" stroke="#E65100" stroke-width="1.5" />
  </g>

  <g transform="translate(160, 100) rotate(-10)">
    <!-- Carrot 2 -->
    <path d="M 15,10 L 30,10 L 22,80 Z" fill="url(#carrotGrad)"/>
    <path d="M 22,10 Q 15,-15 8,-8" fill="none" stroke="#2E7D32" stroke-width="2"/>
    <path d="M 22,10 Q 25,-20 25,-10" fill="none" stroke="#2E7D32" stroke-width="2"/>
    <line x1="18" y1="30" x2="24" y2="31" stroke="#E65100" stroke-width="1.5" />
    <line x1="19" y1="50" x2="25" y2="50.5" stroke="#E65100" stroke-width="1.5" />
  </g>

  <!-- Tomatoes Front-Left -->
  <g transform="translate(130, 160)">
    <!-- Tomato 1 -->
    <circle cx="30" cy="30" r="25" fill="url(#tomatoGrad)" />
    <!-- Leaf -->
    <path d="M 30,5 C 28,0 32,0 30,5 C 25,2 22,6 30,5 C 35,2 38,6 30,5 Z" fill="#2E7D32" />
    <!-- Highlight -->
    <ellipse cx="20" cy="20" rx="5" ry="3" fill="#FFF" opacity="0.6" transform="rotate(-30 20 20)" />
  </g>

  <!-- Yellow Bell Pepper Front-Center -->
  <g transform="translate(200, 155)">
    <!-- Pepper Body -->
    <path d="M 15,15 C 5,15 0,25 0,40 C 0,55 10,65 25,65 C 40,65 50,55 50,40 C 50,25 45,15 35,15 Z" fill="url(#pepperGrad)"/>
    <!-- Lobes detail -->
    <path d="M 25,15 C 20,25 20,55 25,65" fill="none" stroke="#FF8F00" stroke-width="1" opacity="0.4"/>
    <!-- Stem -->
    <path d="M 25,15 Q 25,5 30,2" fill="none" stroke="#2E7D32" stroke-width="4" stroke-linecap="round"/>
    <!-- Highlight -->
    <ellipse cx="12" cy="28" rx="4" ry="8" fill="#FFF" opacity="0.5" transform="rotate(-20 12 28)"/>
  </g>

  <!-- Red Tomato Front-Right -->
  <g transform="translate(250, 170)">
    <circle cx="25" cy="25" r="22" fill="url(#tomatoGrad)" />
    <path d="M 25,5 C 23,2 27,2 25,5 C 21,3 19,7 25,5 Z" fill="#2E7D32" />
    <ellipse cx="16" cy="16" rx="4" ry="2.5" fill="#FFF" opacity="0.6" transform="rotate(-30 16 16)" />
  </g>

  <!-- Wooden Crate Front Panel -->
  <g transform="translate(40, 185)">
    <!-- Main board -->
    <rect x="10" y="0" width="300" height="75" rx="2" fill="url(#crateGrad)" stroke="#3E2723" stroke-width="1"/>
    <!-- Planks spacing line -->
    <line x1="10" y1="25" x2="310" y2="25" stroke="#3E2723" stroke-width="2" />
    <line x1="10" y1="50" x2="310" y2="50" stroke="#3E2723" stroke-width="2" />
    <!-- Vertical corner supports -->
    <rect x="0" y="-30" width="15" height="105" rx="1" fill="#5D4037" stroke="#3E2723" stroke-width="1"/>
    <rect x="305" y="-30" width="15" height="105" rx="1" fill="#5D4037" stroke="#3E2723" stroke-width="1"/>
    <!-- Nails -->
    <circle cx="7" cy="-20" r="2" fill="#78909C" />
    <circle cx="7" cy="12" r="2" fill="#78909C" />
    <circle cx="7" cy="37" r="2" fill="#78909C" />
    <circle cx="7" cy="62" r="2" fill="#78909C" />

    <circle cx="312" cy="-20" r="2" fill="#78909C" />
    <circle cx="312" cy="12" r="2" fill="#78909C" />
    <circle cx="312" cy="37" r="2" fill="#78909C" />
    <circle cx="312" cy="62" r="2" fill="#78909C" />
  </g>
</svg>
